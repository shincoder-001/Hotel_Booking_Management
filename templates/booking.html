<!DOCTYPE html>
<html>
<head>
    <title>Booking - Royal Palace Hotel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="logo">Royal Palace Hotel</div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/rooms">Rooms</a></li>
            <li><a href="/booking">Booking</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/admin">Admin</a></li>
        </ul>
    </nav>

    <section class="form-section">
        <h1>Book a Room</h1>

        {% if message %}
        <p class="success-message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="/booking" onsubmit="return validateBookingForm()">
            <input type="text" id="name" name="name" placeholder="Name" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="text" id="phone" name="phone" placeholder="Phone" required>

            <select name="room_type" required>
    <option value="">Select Room Type</option>

    {% for room in rooms %}
        <option value="{{ room[1] }}">
            {{ room[1] }} - ₹{{ room[2] }}/night
        </option>
    {% endfor %}

</select>

            <label>Check-in Date</label>
            <input type="date" id="checkin" name="checkin" required>

            <label>Check-out Date</label>
            <input type="date" id="checkout" name="checkout" required>

            <input type="number" name="guests" placeholder="Number of Guests" min="1" required>

            <button type="submit" class="btn">Book Room</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Royal Palace Hotel. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
