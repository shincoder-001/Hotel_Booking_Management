<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Royal Palace Hotel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <div class="logo">Royal Palace Hotel</div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/rooms">Rooms</a></li>
            <li><a href="/booking">Booking</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>


    <section class="form-section">

        <h1>Admin Login</h1>

        {% if message %}
            <p class="error-message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="/admin/login">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="btn">
                Login
            </button>

        </form>

    </section>


    <footer>
        <p>
            &copy; 2026 Royal Palace Hotel.
            All rights reserved.
        </p>
    </footer>

</body>
</html>
